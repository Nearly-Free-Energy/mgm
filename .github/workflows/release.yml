name: Release

# Builds MGM's deployment asset for a published GitHub release and attaches it
# to that release, with its third-party notices, a SHA-256 file for each, and a
# build-provenance attestation covering both. Maintainer guide:
# docs/releasing.md.
#
# Publishing a release deploys nothing. This workflow holds no hosting
# credentials and reads no repository secret: it builds Vercel's prebuilt
# output with placeholder project settings and no Vercel account
# (scripts/release/build-deploy-asset.sh). Operators deploy a verified asset
# later, with their own credentials and procedure.
#
# Two jobs, so the code being built never runs with write access:
#   - `Build release asset` checks out the release's tag, refuses unless the
#     tagged commit is on main, and builds on a GitHub-hosted Linux x86-64
#     runner, the platform Vercel runs Node.js functions on. Its token is
#     read-only and is not left on disk.
#   - `Publish release asset` receives the asset and its notices as a
#     workflow artifact, creates their build-provenance attestation, uploads
#     them and their .sha256 files to the release, and appends the asset's
#     details to the release notes. It checks out and runs no repository code.
# docs/releasing.md names both jobs: rename them only together.
#
# A pull request that changes the release path, the dependencies or the
# Node.js version runs `Build release asset` alone, as a dry run: the same
# build and checks on the pull request's merge commit, as version
# v0.0.0-pr.<number>, kept as a workflow artifact for a day. Nothing is
# attested or published. A change that breaks the Linux x86-64 build or its
# checks shows up there, not when a release is published.
#
# A release event runs the workflow file of the tagged commit, so a tag on a
# commit from before this file existed gets no asset. Consumers verify the
# attestation with `gh attestation verify --signer-workflow
# <owner>/<repo>/.github/workflows/release.yml`: moving or renaming this file
# makes later assets fail that check until consumers change it too.

on:
  release:
    types: [published]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/release/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.nvmrc'

# Tighten default token permissions; each job grants only what it needs.
permissions:
  contents: read

# One run per release; a second run for the same tag waits rather than races.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build release asset
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # The release's tag; for a pull request, its merge commit (the default).
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || '' }}
          # Full history, to check that the tagged commit is on main.
          fetch-depth: 0
          # Nothing here pushes; keep the token out of .git/config, where the
          # build could read it.
          persist-credentials: false

      - name: Choose the version and commit
        id: source
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # Dry run: a version no release uses.
            echo "version=v0.0.0-pr.$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          if ! [[ $TAG =~ $re ]]; then
            echo "::error::The release tag must be a version such as v0.0.1 or v0.0.1-rc.1."
            exit 1
          fi
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if [ "$commit" != "$EVENT_SHA" ] || [ "$(git rev-parse HEAD)" != "$commit" ]; then
            echo "::error::The checked-out commit is not the commit tag $TAG points at."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::Tag $TAG points at $commit, which is not on main. Release only commits merged to main."
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # No dependency cache: a release installs from the lockfile from scratch.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Confirm the pinned Node.js major version
        run: |
          node --version
          case "$(node --version)" in
            v24.*) ;;
            *) echo "Expected Node.js 24 from .nvmrc" >&2; exit 1 ;;
          esac

      # The script refuses any host but Linux x86-64, exports the commit, runs
      # npm ci and `vercel build --prod --standalone` with an allowlisted
      # environment, checks the output, packs it, and writes the third-party
      # notices beside it.
      - name: Build the asset
        env:
          VERSION: ${{ steps.source.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          scripts/release/build-deploy-asset.sh --version "$VERSION" --ref "$COMMIT" --out "$RUNNER_TEMP/release"
          cat "$RUNNER_TEMP/release/mgm-vercel-output-$VERSION.build-info.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-asset
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release asset
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # upload the asset to the release and edit its notes
      id-token: write      # sign the attestation with this run's identity
      attestations: write  # store the attestation in this repository

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-asset
          path: ${{ runner.temp }}/release

      - name: Check the asset against its checksum and source
        working-directory: ${{ runner.temp }}/release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="mgm-vercel-output-$TAG.tar.gz"
          info="mgm-vercel-output-$TAG.build-info.json"
          notices="mgm-third-party-notices-$TAG.txt"
          ls -l
          sha256sum -c "$asset.sha256" "$notices.sha256"
          jq -e --arg tag "$TAG" --arg commit "$GITHUB_SHA" \
            '.version == $tag and .commit == $commit and .target == "production"' "$info"

      # One attestation, two subjects: the asset and its notices.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/mgm-vercel-output-${{ github.event.release.tag_name }}.tar.gz
            ${{ runner.temp }}/release/mgm-third-party-notices-${{ github.event.release.tag_name }}.txt

      # Never --clobber: an operator may already have pinned an uploaded asset.
      - name: Upload the asset to the release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="mgm-vercel-output-$TAG.tar.gz"
          notices="mgm-third-party-notices-$TAG.txt"
          gh release upload "$TAG" "$asset" "$asset.sha256" "$notices" "$notices.sha256" --repo "$GITHUB_REPOSITORY"

      - name: Add the asset's details to the release notes
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="mgm-vercel-output-$TAG.tar.gz"
          info="mgm-vercel-output-$TAG.build-info.json"
          notices="mgm-third-party-notices-$TAG.txt"
          commit=$(jq -r .commit "$info")
          sha256=$(jq -r .sha256 "$info")
          notices_sha256=$(cut -d ' ' -f 1 "$notices.sha256")
          signer="${GITHUB_WORKFLOW_REF%@*}"
          {
            echo "## Deployment asset"
            echo
            echo "\`$asset\` is Vercel's prebuilt build output (\`vercel build --prod --standalone\`) for commit \`$commit\`, built by this repository's Release workflow. Publishing it deploys nothing."
            echo
            echo "- SHA-256: \`$sha256\`"
            echo "- Production target: \`vercel deploy --prebuilt\` accepts it only with \`--prod\`."
            jq -r '"- Functions: \(.functions.nodejs) Node.js (\(.runtimes | map(select(. != "edge")) | join(", ")), \(.architectures | join(", "))), \(.functions.edge) edge"' "$info"
            jq -r '"- Built with: Vercel CLI \(.vercelCli); " + ([.builders[] | "\(.use) \(.version // "unknown")"] | join(", ")) + "; " + (.frameworks | join(", "))' "$info"
            echo "- Third-party notices: \`$notices\`, SHA-256 \`$notices_sha256\`, covered by the same attestation."
            echo
            echo "Verify it before deploying (see docs/releasing.md):"
            echo
            echo '```'
            echo "sha256sum -c $asset.sha256"
            echo "gh attestation verify $asset \\"
            echo "  --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $signer \\"
            echo "  --source-digest $commit"
            echo '```'
            echo
            # Matches LICENSE. If the project's license changes, change this line with it.
            echo "The source code for this asset is available under the Eclipse Public License 2.0 at tag \`$TAG\`, in this release's source code archives. The third-party packages the asset contains are listed, with the full text of their licences and notices, in \`$notices\`."
          } > section.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          printf '\n\n' >> notes.md
          cat section.md >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          cat section.md >> "$GITHUB_STEP_SUMMARY"
