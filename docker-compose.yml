services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  gotrue:
    image: supabase/gotrue:v2.198.0
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable&search_path=auth
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      GOTRUE_SITE_URL: http://localhost:3000
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      # Sign-in links (RFC #186): a 10-digit OTP, good for 15 minutes, as
      # supabase/config.toml and production set.
      GOTRUE_MAILER_OTP_LENGTH: "10"
      GOTRUE_MAILER_OTP_EXP: "900"
      # Refuses a token for a password or recovery sign-in (RFC #186 § 6);
      # migration 20261117210000 creates the function and 20261126090100
      # replaces it. Docker mode leaves Supabase Auth's OAuth server off
      # (no GOTRUE_OAUTH_SERVER_* settings), so it has no client sign-in
      # (docs/setup.md, "Clients that are not a browser").
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: "pg-functions://postgres/public/fn_auth_access_token_hook"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      postgres: { condition: service_healthy }
      mgm-migrate: { condition: service_completed_successfully }
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
    # No health check — postgrest image is minimal Nix build with no shell/curl/wget

  kong:
    image: kong:3.5
    depends_on:
      gotrue: { condition: service_healthy }
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_LOG_LEVEL: info
    volumes:
      - ./docker/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "54321:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  mgm-migrate:
    image: postgres:15-alpine
    depends_on:
      gotrue: { condition: service_healthy }
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/seed.sql:/seed.sql:ro
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    command: |
      sh -c '
      echo "Waiting for auth schema..."
      until psql -c "SELECT 1 FROM auth.users LIMIT 0" 2>/dev/null; do sleep 1; done

      if psql -c "SELECT 1 FROM organizations LIMIT 0" 2>/dev/null; then
        # gotrue above calls the access-token hook for every token, so a
        # database made before the newest version of the hook gets it too:
        # the tables it reads, once, then the function itself (CREATE OR
        # REPLACE, safe to re-run). The tables go in one transaction (-1),
        # so a run that stops part way leaves no mgm_clients and the next
        # start applies them again. A later migration that replaces the
        # hook again takes the place of the last psql line.
        # (No apostrophes in this block: it is one single-quoted sh -c.)
        echo "Migrations already applied, skipping; applying the access-token hook."
        if ! psql -c "SELECT 1 FROM mgm_clients LIMIT 0" >/dev/null 2>&1; then
          psql -1 -v ON_ERROR_STOP=1 -f /migrations/20261126090000_mgm_clients_and_approvals.sql || exit 1
        fi
        psql -v ON_ERROR_STOP=1 -f /migrations/20261126090100_auth_access_token_hook_clients.sql || exit 1
        exit 0
      fi

      echo "Granting auth schema access..."
      psql -c "GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;"
      psql -c "GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA auth TO anon, authenticated, service_role;"

      echo "Applying migrations..."
      for f in /migrations/*.sql; do echo "  $$(basename $$f)"; psql -f "$$f"; done
      echo "Applying seed..."
      psql -f /seed.sql
      echo "Done."
      '
    restart: "no"

  mgm-app:
    # One image for every installation: configuration is runtime-only (#46).
    build:
      context: .
    depends_on:
      kong: { condition: service_healthy }
      mgm-migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    environment:
      MGM_PUBLIC_SUPABASE_URL: http://localhost:54321
      MGM_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      SUPABASE_INTERNAL_URL: http://kong:8000
      MGM_PUBLIC_SUPABASE_COOKIE_NAME: sb-mgm-auth-token
      MGM_APP_URL: http://localhost:3000
      # MGM's own mail sender (RFC #186): sign-in links go to the mail
      # catcher below; read them at http://localhost:8025. Plaintext to a
      # name with no dot needs the opt-in, which belongs only here.
      MGM_SMTP_URL: smtp://mailpit:1025
      MGM_SMTP_ALLOW_PLAINTEXT_LOCAL: "1"
      MGM_MAIL_FROM: MGM <no-reply@localhost.test>
      OPENEMS_B2B_URL: http://host.docker.internal:8075
      OPENEMS_B2B_USERNAME: admin
      OPENEMS_B2B_PASSWORD: Icui4cyou
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches the mail MGM sends (sign-in links, invitations); nothing leaves
  # this machine. Web view on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"

volumes:
  pgdata:
